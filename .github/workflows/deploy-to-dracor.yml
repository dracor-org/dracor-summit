name: Deploy to dracor.org

# Builds the site and deploys it with rsync over SSH. Each GitHub environment
# has its own DEPLOY_KEY, which the server restricts to rsync into the summit
# directory (see dracor-org-deployment), so the destination path is relative
# to it. The build runs in a job of its own without access to the key.

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server
        type: choice
        required: true
        options:
          - "staging.dracor.org"
          - "dracor.org"

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # adjust config
      - name: Set site URL
        env:
          SERVER: ${{ inputs.server }}
        run: |
          sed -i -e "s|dracor-org\.github\.io/dracor-summit|summit.$SERVER|" \
            _config.yml _includes/head.html
          cat _config.yml

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      # adjust remaining /dracor-summit occurrences
      - name: Fix URL paths
        run: |
          cp -rv _site _sitex
          for f in $(grep -l /dracor-summit -r _sitex); do
            sed -i -e "s|/dracor-summit/|/|g" $f
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _sitex/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.server == 'dracor.org' && 'production' || 'staging' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to ${{ inputs.server }}
        env:
          SERVER: ${{ inputs.server }}
        run: |
          rsync -rlvz --delete \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            _site/ \
            "github@$SERVER:/"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
